# =====================================================================
# YouDu 生产环境 Nginx 配置（仅管理后台反代）
# 放置位置: /etc/nginx/conf.d/telegram.conf
#
# 架构说明（重要）:
#   - Go 服务(telegram-server)自带 HTTPS：直接监听 8280(API) / 8281(WSS)，
#     客户端直连，不经过 Nginx —— 所以本配置【不能】监听 8280/8281！
#   - Nginx 只负责: 80 跳转 + 443 上的 /admin 反代到管理后台(:3001)
#
# 端口全景:
#   80   nginx  → 跳转 HTTPS
#   443  nginx  → /admin → 127.0.0.1:3001 (telegram-admin)
#   8280 Go自持 → 客户端 API  (HTTPS, RunTLS)
#   8281 Go自持 → 客户端 WS   (WSS,  RunTLS)
#
# ⚠️ 证书路径按实际情况修改；可以直接复用 Go 服务 .env 里
#    CERT_FILE / KEY_FILE 指向的同一对证书文件。
# =====================================================================

upstream telegram_admin {
    server 127.0.0.1:3001;
    keepalive 8;
}

# ---------------------------------------------------------------------
# 80: HTTP 全部跳转 HTTPS
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name xbdchat.cc;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------
# 443: 管理后台（/admin → Node.js :3001）
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xbdchat.cc;

    # ---- 证书（按实际路径修改，可复用 Go 服务用的同一对证书）----
    ssl_certificate     /etc/letsencrypt/live/xbdchat.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xbdchat.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # 管理后台（静态页 + /admin/api 接口都由 Node 处理，无需 rewrite）
    location /admin {
        proxy_pass http://telegram_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 根路径：不对外提供内容（按需改成官网/下载页）
    location / {
        return 404;
    }
}
